# Observación opcional; solo combinar con compose.yml del proyecto identity-load-*.
# Conserva CPU, RAM, pool, durabilidad y volúmenes del ensayo.
services:
  db:
    command: [postgres, -c, shared_preload_libraries=pg_stat_statements, -c, pg_stat_statements.track_planning=on, -c, track_io_timing=on, -c, track_wal_io_timing=on]
  api:
    environment:
      LOAD_ENGINE_DIAGNOSTICS: '1'
  runner:
    environment:
      LOAD_ENGINE_DIAGNOSTICS: '1'
  diagnostic-bench:
    environment:
      LOAD_ENGINE_DIAGNOSTICS: '1'
