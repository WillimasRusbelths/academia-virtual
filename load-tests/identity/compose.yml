x-runner: &runner
  image: academia-local-api:latest
  working_dir: /workspace
  environment: &environment
    APP_ENV: test
    APP_ORIGIN: http://localhost:5173
    MAIL_MODE: capture
    SMTP_HOST: mailpit
    SMTP_PORT: '1025'
    MAIL_FROM: academia@example.test
    MAIL_KEY_ID: load-v1
    TEST_MAIL_PAYLOAD_KEY: ${TEST_MAIL_PAYLOAD_KEY:?}
    TEST_RATE_HMAC_KEY: ${TEST_RATE_HMAC_KEY:?}
    TEST_DATABASE_URL: postgresql://academia_v00_runtime:${PROBE_RUNTIME_PASSWORD:?}@db:5432/academia_v00_test?schema=t_load_identity
    TEST_MIGRATION_DATABASE_URL: postgresql://academia_v00_owner:${PROBE_OWNER_PASSWORD:?}@db:5432/academia_v00_test?schema=t_load_identity
    PROBE_DATABASE_URL: postgresql://academia_v00_runtime:${PROBE_RUNTIME_PASSWORD:?}@db:5432/academia_v00_test
    PROBE_MIGRATION_URL: postgresql://academia_v00_owner:${PROBE_OWNER_PASSWORD:?}@db:5432/academia_v00_test
    DB_POOL_MAX: '10'
    API_HOST: 0.0.0.0
    TRUSTED_PROXY: ''
    LOAD_DIAGNOSTICS: ${LOAD_DIAGNOSTICS:-0}
    LOAD_DIAGNOSTICS_NAME: ${LOAD_DIAGNOSTICS_NAME:-disabled}
  volumes:
    - ../../apps/api/src:/workspace/apps/api/src:ro
    - ../../apps/api/tests:/workspace/apps/api/tests:ro
    - ../../apps/api/package.json:/workspace/apps/api/package.json:ro
    - ../../load-tests/identity:/workspace/load-tests/identity:ro
    - ../../ops/recovery:/workspace/ops/recovery:ro
    - ../../ops/lint:/workspace/ops/lint:ro
    - ../../apps/api/eslint.config.js:/workspace/apps/api/eslint.config.js:ro
    - ../../apps/web/src:/workspace/apps/web/src:ro
    - ../../apps/web/tests:/workspace/apps/web/tests:ro
    - ../../apps/web/eslint.config.js:/workspace/apps/web/eslint.config.js:ro
    - ../../apps/web/vite.config.ts:/workspace/apps/web/vite.config.ts:ro
    - ../../apps/web/index.html:/workspace/apps/web/index.html:ro
    - private:/load-private
services:
  db:
    image: postgres:16.14-bookworm
    cpus: 1
    mem_limit: 512m
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      PROBE_OWNER_PASSWORD: ${PROBE_OWNER_PASSWORD:?}
      PROBE_RUNTIME_PASSWORD: ${PROBE_RUNTIME_PASSWORD:?}
    volumes:
      - database:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-load.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d academia_v00_test']
      interval: 1s
      timeout: 3s
      retries: 40
  mailpit:
    image: axllent/mailpit:v1.31.3
    command: [--disable-version-check, --smtp-disable-rdns, '--smtp-allowed-recipients=@example[.]test$$', --quiet]
  runner:
    <<: *runner
    entrypoint: sh
  diagnostic-bench:
    <<: *runner
    profiles: [diagnostics]
    cpus: 2
    mem_limit: 1g
    entrypoint: sh
  api:
    <<: *runner
    cpus: 2
    mem_limit: 1g
    command: [sh, -c, 'npm run build --workspace apps/api && exec node --experimental-strip-types load-tests/identity/serve.ts']
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 40
  generator:
    image: grafana/k6:1.6.0
    user: '1000:1000'
    cpus: 1
    mem_limit: 512m
    environment:
      K6_NO_USAGE_REPORT: 'true'
    volumes:
      - ../../load-tests/identity:/scripts:ro
      - private:/load-private
    command: [version]
volumes:
  database:
  private:
networks:
  default:
    internal: true
