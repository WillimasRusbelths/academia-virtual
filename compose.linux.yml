# Solo V00-L en una máquina Linux remota desechable/autorizada. No producción.
# Tags candidatos: resolver y registrar digests antes de aprobar V00-L.
name: ${V00_PROJECT:?Definir un nombre exclusivo para este ensayo}
services:
  db:
    image: postgres:16.14-bookworm
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets:
      - pg_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_probe:/var/lib/postgresql/data
      - ./ops/local/provision.sql:/provision.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.31.3
    command:
      - --disable-version-check
      - --smtp-disable-rdns
      - --smtp-allowed-recipients=@example[.]test$$
      - --block-remote-css-and-fonts
      - --quiet
      - --max=0
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
secrets:
  pg_password:
    file: ./.cache/v00-linux/postgres-password
volumes:
  pg_probe:
