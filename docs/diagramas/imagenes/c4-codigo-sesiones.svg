ada</text><rect x="70.0" y="270.0" width="350.0" height="170.0" rx="8" fill="#e5f2ff" stroke="#45647c" stroke-width="2" /><text x="245.0" y="324.76" font-family="Arial" font-size="21" fill="#18344b" text-anchor="middle">C05 · SessionLookup</text><text x="245.0" y="350.38" font-family="Arial" font-size="21" fill="#18344b" text-anchor="middle">class</text><text x="245.0" y="376.0" font-family="Arial" font-size="21" fill="#18344b" text-anchor="middle">authorize / accepted</text><text x="245.0" y="401.62" font-family="Arial" font-size="21" fill="#18344b" text-anchor="middle">[I]</text><rect x="650.0" y="270.0" width="350.0" height="170.0" rx="8" fill="#e5f2ff" stroke="#45647c" stroke-width="2" /><text x="825.0" y="324.76" font-family="Arial" font-size="21" fill="#18344b" text-anchor="middle">C05 · SessionRepository</text><text x="825.0" y="350.38" font-family="Arial" font-size="21" fill="#18344b" text-anchor="middle">interface</text><text x="825.0" y="376.0" font-family="Arial" font-size="21" fill="#18344b" text-anchor="middle">lookup / accept / revoke</text><text x="825.0" y="401.62" font-family="Arial" font-size="21" fill="#18344b" text-anchor="middle">[I]</text><rect x="650.0" y="590.0" width="350.0" height="165.0" rx="8" fill="#e5f2ff" stroke="#45647c" stroke-width="2" /><text x="825.0" y="629.45" font-family="Arial" font-size="21" fill="#18344b" text-anchor="middle">C05 · SessionActor</text><text x="825.0" y="655.07" font-family="Arial" font-size="21" fill="#18344b" text-anchor="middle">interface de datos</text><text x="825.0" y="680.69" font-family="Arial" font-size="21" fill="#18344b" text-anchor="middle">sessionId / userId / role</text><text x="825.0" y="706.3100000000001" font-family="Arial" font-size="21" fill="#18344b" text-anchor="middle">authVersion</text><text x="825.0" y="731.9300000000001" font-family="Arial" font-size="21" fill="#18344b" text-anchor="middle">[I]</text><rect x="70.0" y="590.0" width="350.0" height="165.0" rx="8" fill="#e5f2ff" stroke="#4