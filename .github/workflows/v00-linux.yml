name: Docker Compose manual

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v00-linux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Entorno local Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: academia-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
      - name: Preparar configuración efímera
        run: node ops/docker/configure.mjs
      - name: Validar Compose
        run: |
          docker version
          docker compose version
          docker compose config --quiet
      - name: Construir
        run: docker compose build
      - name: Iniciar los cuatro servicios
        run: docker compose up -d --wait
      - name: Estado y logs
        run: |
          docker compose ps
          docker compose logs --tail=100 db mailpit api web
      - name: Migraciones y pruebas
        run: docker compose exec -T api npm run test:docker
      - name: Navegador
        run: |
          docker compose --profile tests build browser-tests
          docker compose --profile tests run --rm browser-tests
      - name: Auditar dependencias por separado
        continue-on-error: true
        run: docker compose exec -T api npm audit --json
      - name: Registrar plataforma
        shell: bash
        run: |
          docker compose exec -T api node --version >> "$GITHUB_STEP_SUMMARY"
          docker compose exec -T api npm --version >> "$GITHUB_STEP_SUMMARY"
          uname -a >> "$GITHUB_STEP_SUMMARY"
          sha256sum package-lock.json >> "$GITHUB_STEP_SUMMARY"
          docker image inspect node:22.23.1-bookworm-slim postgres:16.14-bookworm axllent/mailpit:v1.31.3 --format '{{json .RepoDigests}}' >> "$GITHUB_STEP_SUMMARY"
      - name: Detener solo el proyecto efímero
        if: always()
        run: docker compose down
